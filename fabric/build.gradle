plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
base { archivesName = 'mangogoatnapper-fabric' }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
dependencies {
 minecraft "com.mojang:minecraft:${minecraft_version}"
 implementation "net.fabricmc:fabric-loader:${loader_version}"
 implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../common/src/main/resources')
processResources { def modVersion = project.version; inputs.property 'version', modVersion; filesMatching('fabric.mod.json') { expand 'version': modVersion } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
jar { from('../LICENSE') }


loom { runs { client { if (project.hasProperty('mangogoatnapperSmoke')) { vmArg '-Dmangogoatnapper.smoke=true'; if (project.hasProperty('mangogoatnapperManual')) vmArg '-Dmangogoatnapper.manual=true'; if (project.hasProperty('mangogoatnapperElevated')) vmArg '-Dmangogoatnapper.elevated=true'; if (project.hasProperty('mangogoatnapperWater')) vmArg '-Dmangogoatnapper.water=true'; if (project.hasProperty('mangogoatnapperUnderground')) vmArg '-Dmangogoatnapper.underground=true' } } } }
