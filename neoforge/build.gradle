plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = mod_version
group = mod_group_id
base { archivesName = 'mangogoatnapper-neoforge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../common/src/main/resources')
neoForge {
 version = project.neo_version
 runs { client { client(); if (project.hasProperty('mangogoatnapperSmoke')) { systemProperty 'mangogoatnapper.smoke', 'true'; if (project.hasProperty('mangogoatnapperManual')) systemProperty 'mangogoatnapper.manual', 'true'; if (project.hasProperty('mangogoatnapperElevated')) systemProperty 'mangogoatnapper.elevated', 'true' } } }
 mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
def metadata = tasks.register('generateModMetadata', ProcessResources) {
 def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, neo_version: neo_version, minecraft_version_range: minecraft_version_range]
 inputs.properties props
 expand props
 from 'src/main/templates'
 into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { from('../LICENSE') }

